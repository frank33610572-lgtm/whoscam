<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whoscam 防詐小幫手</title>
<meta name="description" content="把可疑的截圖或對話傳給 Whoscam，30 秒告訴你風險和下一步。">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Whoscam">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday app for all ages: calm, warm, one thing at a time
   IDEA a chat with a friend who knows scams, like the LINE people already use
   PICTURE the phone open mid-conversation: a screenshot sent, a red traffic-light verdict, one big next step
   COLOUR soft chat ground, indigo brand, red / amber / green only for risk
   TYPE Noto Sans TC, Inter for numbers; 17px body, 44px targets
   LAYOUT laptop: phone left, tester sheet right; phone width: the app is the whole screen */
:root{color-scheme:light dark;--page:light-dark(#eceafd,#0d0e1a);--bg:light-dark(#ffffff,#13141f);--chat:light-dark(#f1f2f8,#0f1019);--sub:light-dark(#f4f4fa,#1c1d2b);--ink:light-dark(#151726,#eef0f8);--mute:light-dark(#646a80,#9aa1b8);--line:light-dark(#e3e4ef,#2b2d3f);--brand:light-dark(#4f46e5,#8f88ff);--brandink:light-dark(#3730a3,#c4c0ff);--brandsoft:light-dark(#eeedff,#22214a);--fill:light-dark(#4f46e5,#5b52f0);--red:light-dark(#dc2f2f,#ff6a62);--fillred:light-dark(#dc2f2f,#c92a2a);--redsoft:light-dark(#fdeded,#3b1b1d);--amber:light-dark(#b86e00,#ffb547);--ambersoft:light-dark(#fff4dd,#3a2c12);--green:light-dark(#178a4c,#4fd18a);--greensoft:light-dark(#e6f6ed,#132f22);--card:light-dark(#ffffff,#1a1b29)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font:17px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1160px;margin:0 auto;padding:28px max(16px,4vw) 48px;display:grid;grid-template-columns:minmax(0,410px) minmax(0,1fr);gap:48px;align-items:start}
.phone{background:#0a0b12;border-radius:46px;padding:11px;box-shadow:0 40px 80px -40px #1e1b4b99;position:sticky;top:20px}
.screen{background:var(--bg);border-radius:36px;height:min(840px,calc(100svh - 60px));min-height:640px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.status{display:flex;justify-content:space-between;padding:12px 26px 2px;font:600 14px Inter,sans-serif}
.head{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:13px;background:var(--fill);color:#fff;display:grid;place-items:center;font:800 18px Inter,sans-serif;flex:none}
.head .t{flex:1}
.head b{display:block;font-size:17px;line-height:1.2}
.head span{font-size:13px;color:var(--green);display:flex;align-items:center;gap:5px}
.head span i{width:8px;height:8px;border-radius:50%;background:currentColor}
.head span.off{color:var(--amber)}
.sosbtn{border:0;background:var(--fillred);color:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;min-height:42px}
.iconbtn{border:0;background:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.view{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chatv{background:var(--chat);padding:14px 12px 10px}
.pagev{padding:6px 18px 24px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px 4px 10px}
.tabs button{border:0;background:none;color:var(--mute);font-size:13px;display:grid;justify-items:center;gap:2px;min-height:52px}
.tabs button[aria-current=page]{color:var(--brand);font-weight:700}
.tabs svg{width:24px;height:24px}
.row{display:flex;gap:8px;margin:10px 0;align-items:flex-end}
.row.me{justify-content:flex-end}
.av{width:34px;height:34px;border-radius:11px;background:var(--fill);color:#fff;display:grid;place-items:center;font:800 14px Inter,sans-serif;flex:none}
.bub{max-width:82%;background:var(--card);border-radius:6px 20px 20px 20px;padding:10px 14px;box-shadow:0 1px 2px #0000000d;font-size:16.5px}
.me .bub{background:var(--fill);color:#fff;border-radius:20px 6px 20px 20px}
.bub p{margin:0}
.bub p+p{margin-top:6px}
.bub.img{padding:4px;background:none;box-shadow:none}
.bub.img img{max-width:160px;max-height:240px;border-radius:16px;display:block}
.bub .imgs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.typing{display:flex;gap:5px;padding:4px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px 42px}
.chip{border:1.5px solid color-mix(in srgb,var(--brand) 45%,transparent);background:var(--bg);color:var(--brandink);border-radius:99px;padding:9px 16px;min-height:48px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip.main{background:var(--fill);color:#fff;border-color:var(--fill)}
.chip.red{background:var(--fillred);color:#fff;border-color:var(--fillred)}
.chip.dim{color:var(--mute);border-color:var(--line);font-weight:500}
.start{display:grid;gap:10px;margin:4px 0 10px 42px}
.sbtn{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:14px;min-height:76px;color:var(--ink);box-shadow:0 1px 2px #0000000d}
.sbtn .si{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--brandsoft);color:var(--brandink)}
.sbtn .si svg{width:26px;height:26px}
.sbtn b{display:block;font-size:17.5px;line-height:1.3}.sbtn span{font-size:14px;color:var(--mute)}
.sbtn.main{background:var(--fill);border-color:var(--fill);color:#fff}.sbtn.main span{color:#ffffffcc}.sbtn.main .si{background:#ffffff26;color:#fff}
.sbtn.red{border-color:color-mix(in srgb,var(--red) 40%,transparent)}.sbtn.red .si{background:var(--redsoft);color:var(--red)}.sbtn.red b{color:var(--red)}
.slink{justify-self:start;border:0;background:none;color:var(--brand);font-weight:700;font-size:15.5px;min-height:44px;padding:0 4px}
.resetbtn{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;min-height:42px;font-size:15px;font-weight:700;display:flex;gap:5px;align-items:center;flex:none}
.resetbtn svg{width:19px;height:19px}
a.btn{text-decoration:none;margin-top:10px}
.hhello{margin:8px 0 14px}.hhello span{color:var(--mute);font-size:15px}.hhello .hi{margin:2px 0 0}
.hero{background:linear-gradient(135deg,var(--fill),color-mix(in srgb,var(--fill) 70%,#9333ea));color:#fff;border-radius:26px;padding:18px;box-shadow:0 18px 30px -18px color-mix(in srgb,var(--fill) 80%,transparent)}
.hero b{display:block;font-size:21px;line-height:1.3}.hero .ht{font-size:15px;opacity:.9;margin-top:2px}
.heroB{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.heroB button{border:0;border-radius:16px;min-height:56px;background:#fff;color:#3730a3;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.heroB button+button{background:#ffffff26;color:#fff}
.heroL{border:0;background:none;color:#fff;opacity:.9;font-weight:700;font-size:15px;min-height:44px;padding:0;margin-top:4px;text-decoration:underline;text-underline-offset:3px}
.sosCard{width:100%;display:grid;grid-template-columns:48px 1fr 22px;gap:12px;align-items:center;text-align:left;margin-top:12px;border:1.5px solid color-mix(in srgb,var(--red) 35%,transparent);background:var(--redsoft);border-radius:22px;padding:14px;min-height:78px;color:var(--ink)}
.sosCard .si{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--fillred);color:#fff}
.sosCard b{display:block;font-size:17.5px;color:var(--red)}.sosCard span span{font-size:14px;color:var(--mute)}
.lastc{width:100%;display:grid;grid-template-columns:auto 1fr 22px;gap:12px;align-items:center;text-align:left;margin-top:12px;border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:12px 14px;color:var(--ink)}
.lastc .tl{transform:scale(.8)}.lastc b{display:block;font-size:16px}.lastc span span{font-size:13.5px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:grid;gap:6px;align-content:start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:14px;min-height:128px;color:var(--ink);text-decoration:none}
.tile .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--brandsoft);color:var(--brandink);margin-bottom:4px}
.tile b{font-size:17px;line-height:1.3}.tile span:last-child{font-size:13.5px;color:var(--mute);line-height:1.4}
.tile.g .si{background:var(--greensoft);color:var(--green)}.tile.a .si{background:var(--ambersoft);color:var(--amber)}.tile.r .si{background:var(--redsoft);color:var(--red)}
.tip{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--sub);border-radius:22px;padding:14px;margin:12px 0 4px}
.tip .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--ambersoft);color:var(--amber)}
.tip p{margin:2px 0 0;font-size:16px;font-weight:700;line-height:1.5}.tip small{color:var(--mute);font-size:13px}
.pagev{background:var(--chat)}
.pagev .card{background:var(--card);border:1px solid var(--line)}
.tabs button svg{box-sizing:content-box;padding:3px 16px;border-radius:99px;transition:background .2s}
.tabs button[aria-current=page] svg{background:var(--brandsoft)}
.hero{position:relative;overflow:hidden}.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:#ffffff1a}
.hero>*{position:relative;z-index:1}
.btn.line{background:#06c755;color:#fff;text-decoration:none;margin-top:4px}
.invbox{background:var(--sub);border-radius:12px;padding:8px 12px;font:13px/1.4 ui-monospace,monospace;word-break:break-all;color:var(--mute);margin-top:10px}
.step{background:var(--sub);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:grid;gap:4px}.step b{font-size:16px}.step span{font-size:14px;color:var(--mute)}.step .btn{justify-self:start;margin-top:4px}
.joinill{width:72px;height:72px;border-radius:22px;background:var(--brandsoft);color:var(--brand);display:grid;place-items:center;margin:4px auto 10px}.joinill svg{width:40px;height:40px}
.famhero{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px 16px 12px 8px;margin:8px 0 2px}
.famhero b{display:block;font-size:18px;line-height:1.35}.famhero span{font-size:14px;color:var(--mute)}.famill{width:110px;height:82px}
.gcard{width:100%;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:10px;color:var(--ink)}
.gcard.hot{border-color:var(--red);background:var(--redsoft)}.gcard b{display:block;font-size:16.5px}.gcard b em{font-style:normal;font-weight:500;color:var(--mute);font-size:13px;margin-left:6px}.gcard>span>span{font-size:13.5px;color:var(--mute)}
.face.sm{width:48px;height:48px;font-size:19px}.face .st.gone{background:var(--mute)}
.dot{min-width:24px;height:24px;border-radius:99px;background:var(--fillred);color:#fff;font:700 13px/24px Inter,sans-serif;text-align:center;padding:0 6px}
.alr{background:var(--redsoft);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14.5px}.alr.test{background:var(--sub)}.alr small{color:var(--mute);font-size:12.5px}.alr b{display:block;font-size:15.5px}
.homealert{width:100%;display:grid;grid-template-columns:40px 1fr 22px;gap:10px;align-items:center;text-align:left;background:var(--fillred);color:#fff;border:0;border-radius:20px;padding:12px 14px;margin:8px 0 4px;animation:pop .4s}
.homealert svg:first-child{width:28px;height:28px}.homealert b{display:block;font-size:16.5px}.homealert span span{font-size:13.5px;opacity:.92}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.mini{background:var(--chat);border-radius:14px;padding:8px;margin-top:6px;max-height:150px;overflow:hidden;position:relative;font-size:13.5px}
.mini::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--chat))}
.me .mini{background:#ffffff26;color:#fff}.me .mini::after{background:none}
.mini div{margin:2px 0}
.res{width:min(320px,86%);background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 2px 10px -4px #0003}
.res .top{padding:16px 16px 12px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.res.high .top{background:var(--redsoft)}.res.mid .top{background:var(--ambersoft)}.res.low .top{background:var(--greensoft)}
.tl{display:grid;gap:5px;background:#1a1b29;border-radius:14px;padding:7px}
.tl i{width:18px;height:18px;border-radius:50%;background:#3a3b4d}
.tl i.r.on{background:#ff5a52;box-shadow:0 0 10px #ff5a52}.tl i.a.on{background:#ffb02e;box-shadow:0 0 10px #ffb02e}.tl i.g.on{background:#3ccf7f;box-shadow:0 0 10px #3ccf7f}
.res h3{margin:0;font-size:22px;line-height:1.25;font-weight:900}
.res.high h3{color:var(--red)}.res.mid h3{color:var(--amber)}.res.low h3{color:var(--green)}
.res .body{padding:12px 16px 14px;font-size:15.5px}
.res .type{font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.tag{background:var(--redsoft);color:var(--red);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.res.mid .tag{background:var(--ambersoft);color:var(--amber)}
.res .btns{display:grid;gap:8px;padding:0 16px 16px}
.btn{border:0;border-radius:16px;padding:12px 16px;min-height:50px;font-weight:700;font-size:16.5px;background:var(--fill);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.red{background:var(--fillred)}
.btn.soft{background:var(--brandsoft);color:var(--brandink)}
.btn.plain{background:var(--sub);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-flex;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--greensoft);color:var(--green)}
.badge.m{background:var(--ambersoft);color:var(--amber)}
.rep{width:min(320px,86%);background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 2px 10px -4px #0003}
.rep h4{margin:0 0 6px;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.rep pre{white-space:pre-wrap;font:inherit;font-size:14.5px;margin:0;max-height:150px;overflow:hidden;position:relative;color:var(--ink)}
.rep .att{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.rep .att img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.rep .att span.ic{width:34px;height:34px;border-radius:8px;background:var(--sub);display:grid;place-items:center}
.stat{width:min(320px,86%);background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 2px 10px -4px #0003}
.stat ol{list-style:none;margin:8px 0 0;padding:0}
.stat li{display:flex;gap:10px;align-items:center;color:var(--mute);padding:4px 0}
.stat li::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.stat li.on{color:var(--ink);font-weight:700}.stat li.on::before{background:var(--green);border-color:var(--green)}
.numcard{display:grid;gap:8px;margin-top:8px}
.numcard div{display:flex;justify-content:space-between;gap:10px;background:var(--sub);border-radius:12px;padding:8px 12px;font-size:15px}
.numcard b{white-space:nowrap}
.compose{display:flex;gap:6px;align-items:flex-end;padding:8px 10px 10px;border-top:1px solid var(--line);background:var(--bg)}
.compose textarea{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:10px 14px;background:var(--sub);font-size:16px;line-height:1.45;max-height:120px;min-height:46px;resize:none}
.circ{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--sub);color:var(--ink);flex:none}
.circ.send{background:var(--fill);color:#fff}
.circ.rec{background:var(--fillred);color:#fff;animation:pu 1.2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 8px #dc2f2f33}}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}
.sec h3{margin:0;font-size:18px}
h2.hi{font-size:26px;line-height:1.2;font-weight:900;margin:10px 0 4px}
.lede{color:var(--mute);margin:0 0 14px;font-size:15.5px}
.card{background:var(--sub);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.faces{display:flex;justify-content:center;gap:14px;margin:12px 0}
.slot{display:grid;justify-items:center;gap:6px;width:86px;border:0;background:none;padding:0}
.face{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:27px;font-weight:900;color:#fff;position:relative}
.face.empty{border:2px dashed var(--line);color:var(--mute)}
.face .st{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;border:3px solid var(--bg);background:var(--green)}
.face .st.wait{background:var(--amber)}
.slot .face{color:#fff;font-size:27px}.slot .face.empty{color:var(--mute)}.slot b{font-size:14.5px}.slot span{font-size:12.5px;color:var(--mute)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.sw:first-child{border-top:0}
.sw input{appearance:none;width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:.2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.2s}
.sw input:checked{background:var(--green)}.sw input:checked::after{left:23px}
.pv{background:var(--bg);border-radius:16px;padding:12px;display:grid;grid-template-columns:36px 1fr;gap:10px;box-shadow:0 4px 14px -6px #0003;font-size:14.5px}
.pv .logo{width:36px;height:36px;border-radius:10px;font-size:15px}
.cando{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14.5px}
.cando ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.y{color:var(--green);font-weight:900}.n{color:var(--red);font-weight:900}
.reel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rv{border:0;background:none;padding:0;text-align:left;position:relative}
.rv img{width:100%;aspect-ratio:9/14;object-fit:cover;border-radius:18px;display:block;background:var(--sub)}
.rv .play{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:#fffffff0;color:#111;display:grid;place-items:center}
.rv b{display:block;font-size:15.5px;margin-top:6px}.rv>span:last-child{font-size:13px;color:var(--mute)}
.vok{position:absolute;right:8px;top:8px;background:var(--green);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:2px 8px}
.pts{background:var(--fill);color:#fff;border-radius:22px;padding:16px 18px;margin:8px 0 4px}
.pts .n{font:800 36px/1 Inter,sans-serif}
.meter{height:10px;border-radius:9px;background:#ffffff33;margin:10px 0 6px;overflow:hidden}.meter i{display:block;height:100%;background:#fff}
.rw{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rw:first-child{border-top:0}
.rw b{display:block;font-size:15.5px}.rw span{font-size:13px;color:var(--mute)}
.small{min-height:42px;padding:6px 14px;font-size:15px;width:auto}
.vp{background:#000;border-radius:22px;overflow:hidden;margin:4px 0 10px}
.vp video{width:100%;max-height:520px;aspect-ratio:9/16;display:block;background:#000}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--brand)}
.dots{display:flex;gap:6px}.dots i{width:28px;height:6px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--brand)}
.ans{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:14px;margin-bottom:10px;font-size:16.5px;min-height:56px}
.ans.right{border-color:var(--green);background:var(--greensoft)}.ans.wrong{border-color:var(--red);background:var(--redsoft)}
.link{border:0;background:none;color:var(--brand);font-weight:700;font-size:15px;min-height:44px;padding:0}
.overlay{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:.25s;z-index:5}
.overlay.on{opacity:1;visibility:visible}
.sheet{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px 22px;transform:translateY(30px);transition:.25s}
.overlay.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 6px;font-size:20px}
.sheet textarea,.sheet input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);font-size:16px}
.sheet textarea{min-height:240px;line-height:1.6}
.bank{border-radius:18px;overflow:hidden;border:1.5px solid var(--line);margin:8px 0 12px}
.bank .bar{background:#0f5132;color:#fff;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between}
.bank .in{padding:12px 14px;font-size:15px}
.bank ul{margin:4px 0 8px;padding-left:20px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.chk input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin-top:2px}
.rels{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rels button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;min-height:42px}
.rels button[aria-pressed=true]{border-color:var(--brand);background:var(--brandsoft);color:var(--brandink);font-weight:700}
.full .b{background:var(--chat);border-radius:14px;padding:8px 12px;margin:6px 0;font-size:15px}
.full .b.hit{background:var(--redsoft);box-shadow:inset 3px 0 0 var(--red)}
.full .b small{display:block;color:var(--mute);font-size:12.5px}
.full .b em{font-style:normal;color:var(--red);font-weight:700}
.toast{position:absolute;left:16px;right:16px;bottom:150px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;font-size:15px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
.notif{position:absolute;left:10px;right:10px;top:40px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 14px 30px -10px #0005;display:grid;grid-template-columns:36px 1fr;gap:10px;font-size:14px;opacity:0;visibility:hidden;transform:translateY(-16px);transition:.3s;z-index:8}
.notif.on{opacity:1;visibility:visible;transform:none}
.notif .logo{width:36px;height:36px;border-radius:10px;font-size:15px}
.side h2{font-size:clamp(30px,4vw,44px);line-height:1.08;letter-spacing:-.02em;margin:10px 0 12px;text-wrap:balance}
.side>p{max-width:58ch;color:var(--mute);margin:0 0 20px}
.sc{background:var(--card);border-radius:24px;padding:18px 22px;margin-bottom:16px}
.sc h3{margin:0;font-size:18px}
.task{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.task.ok .tick{background:var(--green);border-color:var(--green)}
.task b{display:block;font-size:16px}.task span{font-size:14px;color:var(--mute)}
.pill{display:inline-flex;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;background:var(--redsoft);color:var(--red)}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);justify-items:center}.side{max-width:560px;width:100%}.phone{position:static;width:100%;max-width:410px}}
@media(max-width:520px){.wrap{padding:0 0 32px;gap:22px}.phone{border-radius:0;padding:0;box-shadow:none;max-width:none;background:none}.screen{border-radius:0;height:100svh;min-height:560px}.side{padding:0 16px}}
html:not(.demo) .wrap{display:block;max-width:none;padding:0}
html:not(.demo) .side{display:none}
html:not(.demo) .phone{position:static;padding:0;border-radius:0;box-shadow:none;background:var(--page);max-width:520px;margin:0 auto}
html:not(.demo) .screen{border-radius:0;height:100svh;min-height:0}
html:not(.demo) .status{display:none}
html:not(.demo) .head{padding-top:calc(10px + env(safe-area-inset-top))}
html:not(.demo) .tabs{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
@media(min-width:521px){html:not(.demo) .screen{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

  try { for (const f of files){ const {data} = await w.recognize(await shrink(f)); out.push(...String(data.text || '').split(/\n+/)); } } finally { w.terminate(); }
  const lines = out.map(l => l.replace(/(?<=[\u3400-\u9fff\uff00-\uffef])\s+(?=[\u3400-\u9fff\uff00-\uffef0-9])/g, '').replace(/(?<=[0-9])\s+(?=[\u3400-\u9fff])/g, '').trim())
    .filter(l => l.length >= 2 && !/^(上午|下午)?\s*\d{1,2}[:：]\d{2}$/.test(l) && !/^已讀/.test(l) && /[\u3400-\u9fff]/.test(l));
  if (!lines.length) throw {code:'empty'}; return lines.join('\n'); }

// ---------- analysis ----------
function analyse(raw){
  const out = []; let day = ''; const found = {}, first = {};
  raw.split(/\n/).map(l => l.trim()).filter(Boolean).forEach(l => {
    const d = l.match(/^【(.+)】$/); if (d){ day = d[1]; out.push({day}); return; }
    const m = l.match(/^([^：:]{1,10})[：:](.*)$/); const who = m ? m[1].trim() : ''; const text = m ? m[2].trim() : l;
    const calm = CALM.test(l); const hits = RULES.filter(r => r.re.test(l) && !(r.k === 'pressure' && calm)).map(r => r.k);
    hits.forEach(k => { found[k] = (found[k] || 0) + 1; if (!first[k]) first[k] = text; });
    out.push({who, text, me:who === '我', hits, day});
  });
  let score = RULES.reduce((s, r) => s + (found[r.k] ? r.w : 0), 0);
  if (found.money && found.pressure) score += 2; if (found.money && found.secrecy) score += 2;
  if (found.money && !found.pressure && !found.secrecy && !found.profit && !found.authority && !found.imperson) score = Math.min(score, 2);
  const level = score >= 6 ? 'high' : score >= 3 ? 'mid' : 'low'; const names = RULES.filter(r => found[r.k]).map(r => r.name);
  const type = found.profit ? '假投資' : found.authority ? '假檢警' : found.imperson ? '假冒熟人借錢' : found.link ? '假網購' : level === 'low' ? '一般對話' : '可疑對話';
  const why = level === 'high' ? (found.profit ? '保證獲利、限時入金又要你保密，這是假投資最常見的組合。' : found.authority ? '真正的檢警不會要你交錢監管，也不會要你對家人保密。' : found.imperson ? '自稱老朋友、突然急著借錢又要你保密，先打給本人確認。' : '對方一直催你付款，又不讓你查證。') : level === 'mid' ? '不一定是詐騙，但已經值得停下來，用官方管道查一下。' : names.length ? '有提到轉帳，但沒有催促或保密，像一般對話。' : '沒有發現常見的詐騙訊號。';
  return {level, found, first, names, why, type, lines:out, ai:false};
}
const maskText = t => t.replace(/\b(\d{3})[-\s]?\d{3,4}[-\s]?\d{3,4}[-\s]?(\d{2,4})\b/g, '$1-****-****-$2').replace(/[A-Z][12]\d{8}/g, m => m[0] + '*******' + m.slice(-2)).replace(/(09\d{2})-?\d{3}-?(\d{3})/g, '$1-***-$2');
async function askJSON(prompt, opts){
  try { const v = await SAMPLE.json(prompt, opts); if (v && typeof v === 'object') return v; } catch (e) { if (e && (e.code === 'not_granted' || e.code === 'rate_limited')) throw e; }
  const r = await SAMPLE(prompt, opts); const m = String(r.text || '').match(/\{[\s\S]*\}/); if (!m) throw {code:'bad_json'}; return JSON.parse(m[0]);
}
async function shrink(file){ try { const b = await createImageBitmap(file); const k = Math.min(1, 2000 / Math.max(b.width, b.height)); if (k >= 1 && file.size < 1.5e6) return file;
  const c = document.createElement('canvas'); c.width = Math.round(b.width * k); c.height = Math.round(b.height * k); c.getContext('2d').drawImage(b, 0, 0, c.width, c.height); return await new Promise(r => c.toBlob(x => r(x || file), 'image/jpeg', 0.88)); } catch (e) { return file; } }
const OCR_PROMPT = `你是聊天截圖的文字辨識工具。依照圖片順序，逐則還原截圖中的對話。
規則：右側的對話泡泡（LINE 通常是綠色）是使用者本人，who 填「我」；左側是對方，看得到名稱就用名稱，看不到就填「對方」。日期分隔列輸出為 {"type":"day","text":"..."}。忽略時間、已讀、輸入框、系統提示；照片、貼圖、語音寫成「[圖片]」「[貼圖]」「[語音]」。文字照原樣，不要改寫。
只輸出 JSON：{"items":[{"type":"msg","who":"我","text":"..."}]}`;
async function ocr(files){
  if (!SAMPLE) return localOCR(files); const lim = await SAMPLE.limits(); if (!lim || !lim.images) throw {code:'no_images'};
  const out = await askJSON(OCR_PROMPT, {images:await Promise.all(files.map(shrink)), modelTier:'default'});
  const lines = (Array.isArray(out.items) ? out.items : []).map(it => it && it.type === 'day' ? `【${String(it.text || '').slice(0, 20)}】` : (it && it.text ? `${String(it.who || '對方').replace(/[：:\n]/g, '').slice(0, 10) || '對方'}：${String(it.text).replace(/\n/g, ' ')}` : '')).filter(Boolean);
  if (!lines.some(l => !l.startsWith('【'))) throw {code:'empty'}; return lines.join('\n');
}
const CODES = {pressure:1, secrecy:1, money:1, profit:1, authority:1, platform:1, link:1, imperson:1};
async function aiAnalyse(text){
  const base = analyse(text); const msgs = base.lines.filter(l => l.who !== undefined); if (!SAMPLE || !msgs.length) throw {code:'unavailable'};
  const numbered = msgs.map((m, i) => `[${i + 1}] ${m.who || '（描述）'}：${m.text}`).join('\n');
  const out = await askJSON(`你是台灣的防詐騙分析助手。以下是使用者傳來的對話，或使用者用自己的話描述的狀況（「我」是使用者本人）。看整段脈絡判斷使用者是否可能正在遭遇詐騙。
訊號代碼只能用：pressure（限時壓力）、secrecy（要你保密）、money（要求轉帳或付款）、profit（保證獲利）、authority（假冒公權力）、platform（要你換平台）、link（陌生連結）、imperson（假冒熟人）。
level：high＝多個訊號同時出現或對方已在要錢；mid＝有可疑之處；low＝一般對話。
只輸出 JSON：{"level":"high|mid|low","type":"詐騙類型，例如假冒熟人借錢；不像詐騙填一般對話","why":"給使用者的一句白話，35 字以內","signals":[{"code":"money","line":3,"quote":"關鍵字句，20 字內"}]}
內容：
${numbered}`, {modelTier:'default'});
  const level = ['high','mid','low'].includes(out.level) ? out.level : base.level; const found = {}, first = {}; msgs.forEach(m => m.hits = []);
  (Array.isArray(out.signals) ? out.signals : []).forEach(s => { if (!s || !CODES[s.code]) return; found[s.code] = (found[s.code] || 0) + 1; const m = msgs[(+s.line || 0) - 1]; if (m && !m.hits.includes(s.code)) m.hits.push(s.code); if (!first[s.code]) first[s.code] = String(s.quote || (m ? m.text : '')).slice(0, 40); });
  return {level, found, first, names:RULES.filter(r => found[r.k]).map(r => r.name), why:String(out.why || base.why).slice(0, 80), type:String(out.type || base.type).slice(0, 20), lines:base.lines, ai:true};
}

function fireCircle(reason, manual){
  const act = S.circle.filter(m => m.status === 'active'); if (!act.length || S.paused) return false;
  const r = S.result; const kind = r && r.type && r.type !== '一般對話' ? '疑似' + r.type.replace(/^疑似/, '') : '可疑狀況';
  const who = S.me || '你關心的家人';
  const body = manual ? `${who}請你幫忙看一下可疑訊息，方便時打個電話給他。` : `${who}剛遇到${kind}${S.share && r && r.names.length ? '（' + r.names.slice(0, 3).join('、') + '）' : ''}，打個電話問候吧。`;
  const title = manual ? `Whoscam：${who}需要你幫忙` : `Whoscam：${who}可能遇到詐騙`;
  const t = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
  const real = act.filter(m => m.topic);
  S.log.unshift({to:act.map(m => m.name).join('、'), reason, t}); S.log = S.log.slice(0, 20);
  notify(`${real.length ? '正在通知' : '已通知'} ${act.map(m => m.name).join('、')}`, body);
  Promise.allSettled(real.map(m => pub(m.topic, body, {title, tags:['warning', 'whoscam-alert'], priority:4, click:BASE}))).then(rs => {
    const bad = rs.filter(x => x.status === 'rejected').length;
    if (real.length) toast(bad ? `有 ${bad} 位家人沒送出，請檢查網路` : `已送到 ${real.map(m => m.name).join('、')} 的手機`);
    if (bad) { S.log[0].fail = bad; render(false); }
  });
  return true;
}
let syncing = false;
async function sync(){
  if (syncing || !navigator.onLine) return; syncing = true; let changed = false;
  try {
    for (const m of S.circle.filter(x => x.topic)){
      let ms; try { ms = await pull(m.topic, m.lastId); } catch (e) { continue; }
      for (const x of ms){ m.lastId = x.id;
        if (has(x, 'whoscam-join') && m.status === 'pending'){ m.status = 'active'; S.accepted = true; changed = true; notify(`${m.name} 已加入守護圈`, '之後你遇到高風險時，他的手機會收到通知。'); sysNotify(`${m.name} 已加入守護圈`, '之後你遇到高風險時，他會收到通知。', x.id); }
        if (has(x, 'whoscam-quit')){ m.status = 'left'; changed = true; notify(`${m.name} 已退出守護圈`, '你可以重新邀請他。'); }
      }
    }
    for (const g of S.guarding){
      let ms; try { ms = await pull(g.topic, g.lastId); } catch (e) { continue; }
      for (const x of ms){ g.lastId = x.id;
        if ((has(x, 'whoscam-alert') || has(x, 'whoscam-test')) && !g.alerts.some(a => a.id === x.id)){
          g.alerts.unshift({id:x.id, time:x.time, title:x.title || 'Whoscam', msg:x.message, test:has(x, 'whoscam-test'), seen:false}); g.alerts = g.alerts.slice(0, 30); changed = true;
          notify(x.title || 'Whoscam 守護圈', x.message); if (document.hidden) sysNotify(x.title || 'Whoscam 守護圈', x.message, x.id);
        }
        if (has(x, 'whoscam-left')){ g.removed = true; changed = true; }
      }
    }
    S.synced = Date.now();
  } finally { syncing = false; }
  if (changed) render(false); else save();
}

  return `<div class="pts"><div style="font-size:14px;opacity:.85">我的點數</div><div class="n">${S.pts}</div><div class="meter"><i style="width:${Math.min(100, S.today / 60 * 100)}%"></i></div><div style="font-size:13.5px;opacity:.9">今天 ${S.today}/60 點 · ${nextR ? `再 ${nextR.p - S.pts} 點可換${esc(nextR.n)}` : '可以兌換所有好禮了'}</div></div>
  <div class="sec"><h3>60 秒看懂一種詐騙</h3><span class="lede" style="margin:0;font-size:13.5px">看完答對 +30 點</span></div>
  <div class="reel">${VIDEOS.map(v => `<button class="rv" data-vid="${v.id}"><img src="videos/${v.id}.jpg" alt=""><span class="play">${I('play')}</span>${S.done[v.id] ? '<span class="vok">已完成</span>' : ''}<b>${v.t}</b><span>${v.s}</span></button>`).join('')}</div>
  <div class="sec"><h3>兌換好禮</h3><span class="lede" style="margin:0;font-size:13.5px">示範商家</span></div>
  <div class="card" style="padding-top:2px;padding-bottom:2px">${SHOP.map(r => `<div class="rw"><span><b>${r.n}</b><span>${r.p} 點</span></span><button class="btn soft small" data-buy="${r.id}" ${S.pts < r.p ? 'disabled' : ''}>兌換</button></div>`).join('')}</div>
  ${S.codes.length ? `<div class="card"><b>我的兌換券</b>${S.codes.map(c => `<div style="font-size:14px">${esc(c)}</div>`).join('')}</div>` : ''}<p class="lede" style="font-size:13px">點數不可轉讓、不可換現金，有效期 12 個月。</p>`; },
  after:() => { $$('[data-vid]').forEach(b => b.onclick = () => { S.vid = b.dataset.vid; S.prog = S.done[S.vid] ? 100 : 0; S.q = 0; S.pick = null; S.right = 0; S.page = 'video'; render(); });
    $$('[data-buy]').forEach(b => b.onclick = () => { const r = SHOP.find(x => x.id === b.dataset.buy); if (S.pts < r.p) return; S.pts -= r.p; S.codes.push(`${r.n}：WC-${Math.random().toString(36).slice(2, 8).toUpperCase()}`); toast('兌換成功'); render(); }); }};

const VIDEO = {title:() => VIDEOS.find(x => x.id === S.vid).s, html:() => { const v = VIDEOS.find(x => x.id === S.vid);
  if (S.prog < 100) return `<div class="vp"><video id="vp" src="videos/${v.id}.mp4" poster="videos/${v.id}.jpg" controls playsinline preload="metadata"></video></div><div class="prog"><i id="pbar" style="width:${S.prog}%"></i></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px"><span class="lede" style="font-size:13.5px;margin:0">看完就開放 3 題測驗</span><button class="link" id="skip" style="font-size:13px;color:var(--mute)">測試用：跳到測驗</button></div>`;
  if (S.q >= 3){ const all = S.right === 3; return `<div style="text-align:center;padding:30px 0"><div style="width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:${all ? 'var(--greensoft)' : 'var(--ambersoft)'};color:${all ? 'var(--green)' : 'var(--amber)'}">${I(all ? 'check' : 'speak', 'style="width:42px;height:42px"')}</div><h2 class="hi">${all ? (S.gain ? `全對！+${S.gain} 點` : '全對！') : `答對 ${S.right}/3 題`}</h2><p class="lede">${all ? (S.gain ? '點數已存入，可以去兌換好禮。' : '這部的點數已經領過，或今天已達上限。') : '全對才有點數，明天再試試。'}</p><button class="btn" id="tolearn">回到小劇場</button></div>`; }
  const q = v.qs[S.q], done = S.pick !== null;
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px"><b>小測驗</b><div class="dots">${[0, 1, 2].map(i => `<i class="${i <= S.q ? 'on' : ''}"></i>`).join('')}</div></div><p style="font-size:19px;font-weight:700;line-height:1.4">${q[0]}</p>
  ${q[1].map((o, j) => `<button class="ans ${done ? (j === q[2] ? 'right' : j === S.pick ? 'wrong' : '') : ''}" data-ans="${j}" ${done ? 'disabled' : ''}>${o}</button>`).join('')}
  ${done ? `<div class="card" style="background:${S.pick === q[2] ? 'var(--greensoft)' : 'var(--redsoft)'}"><b>${S.pick === q[2] ? '答對了' : '再想想'}</b>　${q[3]}</div><button class="btn" id="nextq">${S.q < 2 ? '下一題' : '看結果'}</button>` : ''}`; },
  after:() => { const v = VIDEOS.find(x => x.id === S.vid);
    const vp = $('#vp'); if (vp){ vp.ontimeupdate = () => { if (!vp.duration) return; S.prog = Math.max(S.prog, vp.currentTime / vp.duration * 100); const pb = $('#pbar'); if (pb) pb.style.width = S.prog + '%'; if (vp.currentTime >= vp.duration - 1.2 && S.page === 'video'){ S.prog = 100; vp.ontimeupdate = null; render(); } }; vp.onended = () => { S.prog = 100; render(); }; }
    const sk = $('#skip'); if (sk) sk.onclick = () => { S.prog = 100; render(); };
    $$('[data-ans]').forEach(b => b.onclick = () => { S.pick = +b.dataset.ans; if (S.pick === v.qs[S.q][2]) S.right++; render(); });
    const n = $('#nextq'); if (n) n.onclick = () => { S.q++; S.pick = null; S.gain = 0; if (S.q >= 3 && S.right === 3 && !S.done[v.id]){ S.gain = Math.min(30, 60 - S.today); S.done[v.id] = true; S.pts += S.gain; S.today += S.gain; tick('t4'); } render(); };
    const t = $('#tolearn'); if (t) t.onclick = () => { S.page = null; render(); }; }};

function fullSheet(){ const r = S.result; if (!r) return;
  sheet(`<h3>整段對話標示</h3><p class="lede">紅色是有警訊的訊息。</p><div class="full">${r.lines.map(o => o.who === undefined ? `<div class="lede" style="text-align:center;margin:8px 0 2px;font-size:13px">${esc(o.day)}</div>` : `<div class="b ${o.hits.length ? 'hit' : ''}">${o.who ? `<small>${esc(o.who)}</small>` : ''}${esc(o.text)}${o.hits.length ? `<small><em>${o.hits.map(k => RULES.find(x => x.k === k).name).join('、')}</em></small>` : ''}</div>`).join('')}</div><button class="btn plain" data-close style="margin-top:12px">關閉</button>`); }
function renderTasks(){ $('#tasks').innerHTML = TASKS.map(t => `<div class="task ${S.tasks[t[0]] ? 'ok' : ''}"><div class="tick">${S.tasks[t[0]] ? I('check', 'style="width:18px;height:18px;stroke-width:3"') : ''}</div><div><b>${t[1]}</b><span>${t[2]}${t[0] === 't3' && S.rec && S.rec.secs ? `（上次 ${S.rec.secs} 秒）` : ''}</span></div></div>`).join(''); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t){ S.tab = t.dataset.tab; S.page = null; render(); return; }
  const a = e.target.closest('[data-act]'); if (a){ S._chipLabel = a.dataset.label || ''; act(a.dataset.act); S._chipLabel = ''; return; }
  if (e.target.closest('[data-close]') || e.target.id === 'overlay') closeSheet();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#shotin').onchange = e => { const f = [...e.target.files].slice(0, 10); e.target.value = ''; if (f.length){ S.tab = 'chat'; S.flow = null; handleShots(f); } };
$('#morein').onchange = e => { [...e.target.files].slice(0, 6).forEach(f => S.rec.extra.push({k:'up', u:f.type.startsWith('image/') ? URL.createObjectURL(f) : '', n:f.name.slice(0, 30)})); e.target.value = ''; toast('已加入證據'); render(); };
$('#reset').onclick = () => { if (S.timer) clearInterval(S.timer); closeSheet(); S = fresh(); greet(); render(); renderTasks(); toast('已重新開始'); };
load(); greet(); render(); renderTasks(); checkJoin(); sync();
setInterval(() => { if (!document.hidden) sync(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
window.addEventListener('online', () => sync());
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
